# Curated Skill & Claim Taxonomy for A5 (Packet Claim-Verifier) and A6 (JD Gap Analyser)
version: "1.0.0"

# Honest-candor / negation / disavowal phrases: if one appears in the same clause
# near a skill mention, the verifier classifies the mention as DISAVOWED_HONEST_GAP
# instead of treating it as a positive unsupported claim.
disavowal_patterns:
  - '(?i)\brather\s+than\b'
  - '(?i)\binstead\s+of\b'
  - '(?i)\bhave\s+not\s+(?:worked|used|built|administered|deployed|managed)\b'
  - '(?i)\bhaven''t\s+(?:worked|used|built|administered|deployed|managed)\b'
  - '(?i)\bnot\s+(?:yet\s+)?(?:worked|experienced|familiar|proficient)\s+with\b'
  - '(?i)\bno\s+(?:direct\s+)?(?:experience|background|exposure)\s+(?:with|in)\b'
  - '(?i)\bwould\s+be\s+new\s+ground\b'
  - '(?i)\bdo\s+not\s+(?:claim|have|use|want\s+the\s+resume\s+to\s+imply)\b'
  - '(?i)\bdon''t\s+(?:claim|have|use)\b'
  - '(?i)\boutside\s+my\s+(?:current\s+)?(?:stack|experience)\b'
  - '(?i)\bhave\s+not\s+been\s+part\s+of\s+my\b'
  - '(?i)\bnot\s+part\s+of\s+my\s+(?:stack|background|work)\b'
  - '(?i)\bcomparable\s+to\b'
  - '(?i)\b-comparable\b'
  - '(?i)\bnot\s+executed\s+against\b'
  - '(?i)\bdialect-only\b'

skills:
  - canonical: "SQL"
    category: "data_engineering"
    aliases:
      - '\bsql\b'
      - '\bstructured\s+query\s+language\b'
      - '\bsql\s+data\s+modeling\b'
      - '\bwindow\s+functions?\b'
      - '\bctes?\b'
  - canonical: "Python"
