    aliases:
      - '\bpython\b'
      - '\bscikit-learn\b'
      - '\bpandas\b'
  - canonical: "R"
    category: "programming"
    aliases:
      - '(?<![a-zA-Z0-9_/])R(?![a-zA-Z0-9_/-])(?=\s*[,;/&)]|\s+programming|\s+studio)'
      - '\br\s+programming\b'
